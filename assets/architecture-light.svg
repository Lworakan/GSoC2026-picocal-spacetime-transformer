<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 892" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
  <style>
    .ink{fill:#24292F}.mut{fill:#6E7781}.acc{fill:#5753C6}
    .bx{fill:#FFFFFF;stroke:#24292F;stroke-width:1.6}
    .bxa{fill:#FFFFFF;stroke:#5753C6;stroke-width:2.2}
    .ar{fill:none;stroke:#24292F;stroke-width:1.5;marker-end:url(#h)}
    .skip{fill:none;stroke:#6E7781;stroke-width:1.3;marker-end:url(#hm)}
    .rail{fill:none;stroke:#6E7781;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#hm)}
    .g{animation:up .6s ease-out backwards}
    .g1{animation-delay:.05s}.g2{animation-delay:.25s}.g3{animation-delay:.45s}.g4{animation-delay:.75s}
    .g5{animation-delay:1.0s}.g6{animation-delay:1.25s}.g7{animation-delay:1.5s}.g8{animation-delay:1.75s}
    @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <marker id="h" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto">
      <path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#24292F" stroke-width="1.5" stroke-linecap="round"/></marker>
    <marker id="hm" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto">
      <path d="M1.5,1.5 L8,5 L1.5,8.5" fill="none" stroke="#6E7781" stroke-width="1.3" stroke-linecap="round"/></marker>
    <filter id="hand" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>

  <g filter="url(#hand)">
    <g class="g g8"><rect class="bxa" x="220" y="40" width="200" height="52" rx="9"/></g>
    <g class="g g7"><rect class="bx" x="160" y="118" width="320" height="58" rx="9"/></g>
    <g class="g g6"><rect class="bx" x="220" y="202" width="200" height="40" rx="9"/></g>
    <g class="g g5">
      <rect class="bx" x="90"  y="268" width="190" height="52" rx="9"/>
      <rect class="bx" x="370" y="268" width="180" height="52" rx="9"/>
      <rect class="bx" x="100" y="348" width="170" height="40" rx="9"/>
      <rect class="bx" x="360" y="342" width="196" height="52" rx="9"/>
    </g>
    <g class="g g4">
      <rect x="180" y="430" width="280" height="244" rx="14" fill="none" stroke="#24292F" stroke-width="1.7"/>
      <rect class="bx" x="220" y="446" width="200" height="32" rx="8"/>
      <rect class="bx" x="220" y="492" width="200" height="32" rx="8"/>
      <rect class="bx" x="220" y="538" width="200" height="32" rx="8"/>
      <rect class="bx" x="220" y="584" width="200" height="42" rx="8"/>
      <path class="skip" d="M220,650 C188,650 188,558 214,555"/>
      <path class="skip" d="M220,552 C194,550 194,465 214,462"/>
      <path class="ar" d="M320,584 L320,572"/>
      <path class="ar" d="M320,538 L320,526"/>
      <path class="ar" d="M320,492 L320,480"/>
    </g>
    <g class="g g3"><rect class="bx" x="220" y="710" width="200" height="40" rx="9"/></g>
    <g class="g g2"><rect class="bx" x="150" y="776" width="340" height="58" rx="9"/></g>

    <g class="g g2"><path class="ar" d="M320,776 L320,752"/></g>
    <g class="g g3"><path class="ar" d="M320,710 L320,676"/></g>
    <g class="g g4"><path class="ar" d="M320,666 L320,654 M250,430 C230,414 205,404 190,392 M390,430 C414,416 440,406 452,396"/></g>
    <g class="g g5"><path class="ar" d="M185,348 L185,322 M458,342 L458,322 M185,268 C190,254 260,248 288,239 M460,268 C452,254 382,248 352,239"/></g>
    <g class="g g6"><path class="ar" d="M320,202 L320,178"/></g>
    <g class="g g7"><path class="ar" d="M320,118 L320,94"/></g>
    <g class="g g5"><path class="rail" d="M150,800 C66,790 66,420 88,296"/></g>
  </g>

  <g class="g g8" text-anchor="middle">
    <text x="320" y="61" class="acc" font-size="15" font-weight="800">&#202;&#611;  photon energy</text>
    <text x="320" y="79" class="mut" font-size="10">&#963;_eff 0.0402 &#183; 5-seed ensemble &#183; D4 TTA &#183; direct-fit calib</text>
  </g>
  <g class="g g7" text-anchor="middle">
    <text x="320" y="137" class="ink" font-size="12.5" font-weight="700">width-binned calibration on q&#8325;&#8320;</text>
    <text x="320" y="153" class="mut" font-size="10.5">3 bins by q&#8327;&#8325; &#8722; q&#8322;&#8325; &#183; linear constants, validation only</text>
    <text x="320" y="167" class="mut" font-size="10.5">only q&#8325;&#8320; exits as &#202;&#611;; the width picks the bin</text>
  </g>
  <g class="g g6" text-anchor="middle">
    <text x="320" y="226" class="ink" font-size="12.5" font-weight="700">base + &#916;q (broadcast)</text>
  </g>
  <g class="g g5" text-anchor="middle">
    <text x="185" y="289" class="ink" font-size="12" font-weight="700">physics readout</text>
    <text x="185" y="306" class="mut" font-size="10.5">a &#183; log(1 + &#931; w&#183;E) + b</text>
    <text x="460" y="289" class="ink" font-size="12" font-weight="700">quantile head</text>
    <text x="460" y="306" class="mut" font-size="10.5">q&#8322;&#8325;, q&#8325;&#8320;, q&#8327;&#8325;</text>
    <text x="185" y="372" class="ink" font-size="12" font-weight="700">per-cell gate w = &#963;(f)</text>
    <text x="458" y="362" class="ink" font-size="12" font-weight="700">mean-pool &#8594; LayerNorm</text>
    <text x="458" y="379" class="mut" font-size="10.5">&#8214; concat six event globals</text>
  </g>
  <g class="g g4" text-anchor="middle">
    <text x="320" y="467" class="ink" font-size="11.5" font-weight="700">Add &amp; Norm</text>
    <text x="320" y="513" class="ink" font-size="11.5" font-weight="700">Feed Forward</text>
    <text x="320" y="559" class="ink" font-size="11.5" font-weight="700">Add &amp; Norm</text>
    <text x="320" y="601" class="ink" font-size="11.5" font-weight="700">Multi-Head</text>
    <text x="320" y="616" class="ink" font-size="11.5" font-weight="700">Self-Attention</text>
    <text x="488" y="558" class="acc" font-size="17" font-weight="800" font-style="italic">&#215; 3</text>
  </g>
  <g class="g g3" text-anchor="middle">
    <text x="320" y="734" class="ink" font-size="12.5" font-weight="700">Linear embedding &#183; d = 128</text>
  </g>
  <g class="g g2" text-anchor="middle">
    <text x="320" y="797" class="ink" font-size="12.5" font-weight="700">&#8804;81 masked cell tokens &#183; 16 features</text>
    <text x="320" y="814" class="mut" font-size="10">log E, E_f, E_b &#183; &#916;t_f, &#916;t_b + has-t flags &#183; &#916;i, &#916;j, r &#183; pitch (log + one-hot)</text>
    <text x="320" y="828" class="mut" font-size="10">cells &gt; 2.5 MeV in the 9&#215;9 window, padded + attention-masked</text>
  </g>
  <g class="g g5">
    <text x="60" y="410" class="mut" font-size="10" font-style="italic" transform="rotate(-90 60 410)" text-anchor="middle">raw cell energies E</text>
  </g>
  <g class="g g4" font-size="10.5" font-style="italic">
    <text x="480" y="640" class="mut">training</text>
    <text x="480" y="655" class="mut">qd loss &#183; EMA 0.999</text>
  </g>
  <g class="g g7" font-size="10.5" font-style="italic">
    <text x="500" y="108" class="mut">inference</text>
    <text x="500" y="123" class="mut">5 seeds &#183; D4 TTA</text>
  </g>
  <g class="g g1" text-anchor="middle">
    <text x="320" y="856" class="mut" font-size="11" font-style="italic">9&#215;9 PicoCal window, minimum-bias event</text>
    <text x="320" y="878" class="mut" font-size="10" font-style="italic">every block was ablated against alternatives &#8212; see the falsification record</text>
  </g>
</svg>
