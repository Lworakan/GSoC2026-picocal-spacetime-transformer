<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
  <style>
    .ink{fill:#1F2328}.mut{fill:#59636E}.wt{fill:#FFFFFF}
    .box{rx:10;stroke-width:1.5}
    .learn{fill:#EEEDFB;stroke:#5753C6}
    .phys{fill:#E6F7F4;stroke:#0D9488}
    .flow{stroke:#59636E;stroke-width:2;fill:none;marker-end:url(#arr)}
    .st{opacity:0;animation:in .55s cubic-bezier(.4,0,.2,1) forwards}
    .s1{animation-delay:.1s}.s2{animation-delay:.45s}.s3{animation-delay:.8s}
    .s4{animation-delay:1.15s}.s5{animation-delay:1.5s}.s6{animation-delay:1.85s}.s7{animation-delay:2.2s}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fl{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s ease-out forwards}
    .f1{animation-delay:.4s}.f2{animation-delay:.75s}.f3{animation-delay:1.1s}
    .f4{animation-delay:1.45s}.f5{animation-delay:1.8s}.f6{animation-delay:2.15s}
    @keyframes dr{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
  </style>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#59636E" stroke-width="1.6"/></marker></defs>

  <text x="60" y="28" class="ink" font-size="15" font-weight="600">Champion architecture — SubNet-QdEMA (physics-structured readout on a token transformer)</text>

  <g class="st s1">
    <rect class="box phys" x="60" y="58" width="150" height="96"/>
    <text x="135" y="82" class="ink" font-size="12.5" font-weight="700" text-anchor="middle">9&#215;9 window</text>
    <text x="135" y="100" class="mut" font-size="11" text-anchor="middle">81 cell tokens &#183; 16 feat</text>
    <text x="135" y="116" class="mut" font-size="11" text-anchor="middle">E front/back &#183; t front/back</text>
    <text x="135" y="132" class="mut" font-size="11" text-anchor="middle">position &#183; pitch region</text>
  </g>
  <path class="flow fl f1" d="M210,106 L248,106"/>

  <g class="st s2">
    <rect class="box learn" x="252" y="80" width="92" height="52"/>
    <text x="298" y="102" class="ink" font-size="12" font-weight="700" text-anchor="middle">Linear</text>
    <text x="298" y="118" class="mut" font-size="11" text-anchor="middle">embed d=128</text>
  </g>
  <path class="flow fl f2" d="M344,106 L382,106"/>

  <g class="st s3">
    <rect class="box learn" x="402" y="64" width="150" height="84" opacity=".35"/>
    <rect class="box learn" x="394" y="72" width="150" height="84" opacity=".6"/>
    <rect class="box learn" x="386" y="80" width="150" height="84"/>
    <text x="461" y="106" class="ink" font-size="12.5" font-weight="700" text-anchor="middle">Transformer &#215;3</text>
    <text x="461" y="124" class="mut" font-size="11" text-anchor="middle">self-attention over cells</text>
    <text x="461" y="140" class="mut" font-size="11" text-anchor="middle">4 heads &#183; FFN 4d</text>
  </g>

  <path class="flow fl f3" d="M544,100 C600,90 620,90 648,116"/>
  <path class="flow fl f3" d="M544,130 C600,160 610,210 630,238"/>

  <g class="st s4">
    <rect class="box learn" x="652" y="92" width="148" height="52"/>
    <text x="726" y="113" class="ink" font-size="12" font-weight="700" text-anchor="middle">per-cell gate &#963;(f)</text>
    <text x="726" y="129" class="mut" font-size="11" text-anchor="middle">learned signal fraction</text>
  </g>
  <path class="flow fl f4" d="M726,144 L726,176"/>
  <g class="st s5">
    <rect class="box phys" x="640" y="180" width="172" height="56"/>
    <text x="726" y="201" class="ink" font-size="12" font-weight="700" text-anchor="middle">physics readout</text>
    <text x="726" y="219" class="mut" font-size="11" text-anchor="middle">a&#183;log(1+&#931; gate&#183;E) + b</text>
  </g>

  <g class="st s4">
    <rect class="box learn" x="560" y="242" width="150" height="52"/>
    <text x="635" y="263" class="ink" font-size="12" font-weight="700" text-anchor="middle">masked mean-pool</text>
    <text x="635" y="279" class="mut" font-size="11" text-anchor="middle">+ 6 event globals</text>
  </g>
  <path class="flow fl f5" d="M710,268 L740,268"/>
  <g class="st s5">
    <rect class="box learn" x="744" y="242" width="106" height="52"/>
    <text x="797" y="263" class="ink" font-size="12" font-weight="700" text-anchor="middle">quantile head</text>
    <text x="797" y="279" class="mut" font-size="11" text-anchor="middle">q25 &#183; q50 &#183; q75</text>
  </g>

  <path class="flow fl f5" d="M726,236 C726,300 700,322 662,336"/>
  <path class="flow fl f6" d="M797,294 C797,318 740,330 668,338"/>

  <g class="st s6">
    <rect class="box phys" x="404" y="318" width="254" height="56"/>
    <text x="531" y="339" class="ink" font-size="12" font-weight="700" text-anchor="middle">base + residual &#8594; width-binned calibration</text>
    <text x="531" y="357" class="mut" font-size="11" text-anchor="middle">6 constants fit jointly by minimizing &#963;_eff on validation</text>
  </g>
  <path class="flow fl f6" d="M404,346 L340,346"/>
  <g class="st s7">
    <rect class="box learn" x="196" y="318" width="140" height="56" stroke-width="2.5"/>
    <text x="266" y="341" class="ink" font-size="14" font-weight="800" text-anchor="middle">E&#770; photon</text>
    <text x="266" y="359" class="mut" font-size="11" text-anchor="middle">&#963;_eff 0.0402</text>
  </g>

  <g class="st s7" font-size="11">
    <rect class="box learn" x="60" y="404" width="216" height="40"/>
    <text x="168" y="421" class="ink" font-weight="700" text-anchor="middle">training</text>
    <text x="168" y="436" class="mut" text-anchor="middle">coverage-width (qd) loss &#183; EMA 0.999</text>
    <rect class="box learn" x="292" y="404" width="216" height="40"/>
    <text x="400" y="421" class="ink" font-weight="700" text-anchor="middle">inference</text>
    <text x="400" y="436" class="mut" text-anchor="middle">5 seeds &#183; D4 test-time augmentation</text>
    <rect x="536" y="410" width="12" height="12" rx="3" fill="#EEEDFB" stroke="#5753C6"/>
    <text x="556" y="421" class="mut">learned</text>
    <rect x="536" y="428" width="12" height="12" rx="3" fill="#E6F7F4" stroke="#0D9488"/>
    <text x="556" y="439" class="mut">physics-structured</text>
    <text x="820" y="439" class="mut" text-anchor="end">every block above was ablated &#8212; see the falsification record</text>
  </g>
</svg>
