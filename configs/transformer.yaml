# Space-time transformer on Stage 1 (Phase 2).
experiment: stage1_spacetime_transformer
data:
  stage: 1
  path: data/full/        # git-ignored; matched_*.root from the mentors
  tree: clusters_matched
  knn_k: 8
  in_features: 6          # cell_x, cell_y, log_energy, front_fraction, t_centered, t_valid
  target: gev             # regression target: gev | log
  split:                  # group-level (file, event) split, seeded
    train: 0.8
    val: 0.1
    test: 0.1
    seed: 0
model:
  name: spacetime_transformer
  d_model: 128
  use_timing: true     # set false for the timing-ablation study
training:
  epochs: 50
  batch_size: 32
  lr: 1.0e-3
evaluation:
  metrics: [bias, rmse, p68]
