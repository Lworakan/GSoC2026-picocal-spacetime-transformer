[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picocal"
version = "0.1.0"
description = "Space-time transformer for LHCb PicoCal calorimeter reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Worakan" }]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "torch-geometric",
    "uproot",
    "awkward",
    "matplotlib",
    "plotly",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
